# cargo-deny configuration — dependency policy for the workspace.
#
# Four checks run from this file:
#   advisories  RustSec advisories against Cargo.lock (the reason this exists;
#               nothing else in CI looks at published vulnerabilities)
#   licenses    every crate in the graph resolves to a license we may ship
#   bans        duplicate and unwanted crates
#   sources     every crate comes from crates.io and nowhere else
#
# Run locally with `cargo deny check` (brew install cargo-deny).

[graph]
# The gdal, sftp, server and cli features each pull dependencies the default
# build does not, and a vulnerability in one of them is still a vulnerability in
# a released binary. Check the union.
all-features = true

[advisories]
# `vulnerability` and `unsound` are always denied and no longer configurable.
# Unmaintained crates are reported only when the workspace depends on one
# directly: those we can act on. A transitive one is the upstream crate's
# problem until it turns into an actual advisory.
unmaintained = "workspace"
yanked = "deny"

# Advisories consciously accepted. Every entry needs a reason and, where the fix
# is out of our hands, the upstream issue that would close it.
ignore = [
	# RUSTSEC-2023-0071 — timing sidechannel in `rsa` (Marvin Attack).
	#
	# This one *does* ship: `rsa` is reached through `russh`, which became a
	# normal dependency of versatiles_core when SFTP moved off `ssh2`. The
	# earlier version of this entry said the opposite, and was written when
	# `russh` was still a unix-only dev-dependency.
	#
	# The vulnerable code is not merely present but reached. This entry used to
	# say `rsa` was only used to parse PKCS#1/PKCS#8 key files, with signatures
	# going through `ssh-key`/`signature` instead; that reading was wrong.
	# Signing does go through `ssh-key`, and `ssh-key` performs the RSA
	# signature with this very crate —
	# `rsa::pkcs1v15::SigningKey::<Sha512>::try_from(..).try_sign(..)` in
	# `ssh-key-0.7.0-rc.11/src/signature.rs:709`. The private-key exponentiation
	# the advisory is about does happen here.
	#
	# Accepted on the attack shape instead, which is the part that holds. Marvin
	# recovers a key by timing RSA *decryption* of attacker-chosen ciphertexts:
	# it needs an oracle that decrypts what the attacker submits and reveals how
	# long it took. An SSH client decrypts nothing with its own key — it signs a
	# transcript whose contents it largely determines — so that oracle does not
	# exist. The residual is a malicious or MITM'd server inducing many timed
	# PKCS#1v1.5 signatures, which is a materially harder attack, bounded by
	# connection count, and only against a client authenticating with an RSA
	# key at all.
	#
	# Two things narrow it further: step 5 of the auth priority in
	# `sftp_utils::open_session` tries `~/.ssh/id_ed25519` before `~/.ssh/id_rsa`,
	# so a user holding both never signs with RSA; and dropping `russh`'s `rsa`
	# feature would remove the crate outright, at the cost of RSA public-key
	# auth.
	#
	# RustSec lists no safe upgrade (https://github.com/RustCrypto/RSA/issues/626),
	# so there is nothing to bump to; drop this entry once `russh` depends on a
	# fixed `rsa`.
	"RUSTSEC-2023-0071",
]

[licenses]
# The workspace ships under MIT, so the allow list is the set of permissive
# licenses compatible with distributing a linked binary. Anything else has to be
# an explicit exception below, which is the point: a new copyleft dependency
# should fail CI rather than arrive unnoticed.
allow = [
	"0BSD",
	"Apache-2.0",
	"Apache-2.0 WITH LLVM-exception",
	"BSD-2-Clause",
	"BSD-3-Clause",
	"BSL-1.0",
	"CC0-1.0",
	"CDLA-Permissive-2.0",
	"ISC",
	"MIT",
	"MIT-0",
	"NCSA",
	"Unicode-3.0",
	"Unlicense",
	"Zlib",
]

# Per-crate exceptions to the list above.
#
# MPL-2.0 is file-level copyleft: it obliges us to publish modifications to the
# licensed files themselves, and we use both crates unmodified. That is
# compatible with an MIT binary, but it is a licence we want to know about
# crate by crate rather than blanket-allow.
exceptions = [
	{ name = "colored", allow = ["MPL-2.0"] },
	{ name = "option-ext", allow = ["MPL-2.0"] },
]

confidence-threshold = 0.8

[bans]
# Duplicate versions are a size and compile-time cost, not a correctness
# problem, and most of them are out of our control (a transitive crate pinning
# an older `hashbrown` or `itertools`). Warn so the list stays visible; do not
# fail CI on someone else's release schedule.
multiple-versions = "warn"
wildcards = "deny"

[sources]
# Every dependency comes from crates.io today. Denying anything else means a git
# or alternate-registry dependency cannot be introduced without editing this
# file — the cheapest supply-chain guard available.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

# The one exception, and a temporary one: `gdal`/`gdal-sys` are pinned to a fork
# carrying georust/gdal#714 (GDAL 3.13 compatibility), by exact revision — see
# the comment on the dependency in versatiles_pipeline/Cargo.toml. Remove this
# entry together with the pin, once a crates.io release includes the fix.
allow-git = ["https://github.com/AlexanderWillner/gdal"]
