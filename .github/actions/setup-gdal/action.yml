name: 'Setup GDAL'
description: 'Install GDAL via the system package manager, caching the GDAL Homebrew tree on macOS'

outputs:
  version:
    description: 'Installed GDAL version (output of `gdal-config --version`)'
    value: ${{ steps.verify.outputs.version }}

runs:
  using: 'composite'
  steps:
    # `ImageVersion` is an environment variable on the runner, and the `env`
    # context inside a composite action does not carry the runner's process
    # environment — `${{ env.ImageVersion }}` in the cache key below expanded to
    # nothing, leaving the key `…-ARM64--<hash>` and the guard it documents
    # inert. Read it in a step, where the shell can see it.
    - name: Identify the runner image
      id: image
      if: runner.os == 'macOS'
      shell: bash
      run: echo "version=${ImageVersion:-unknown}" >>"$GITHUB_OUTPUT"

    # Cache the parts of GDAL's Homebrew tree a build actually reads, packed
    # into one tarball — see scripts/pack-gdal-tree.sh for what is kept and why.
    # Packing the kegs whole is ~5 GB; packing libgdal's link closure plus the
    # install receipts is ~190 MB, and both let `brew install` relink instead of
    # re-pouring bottles.
    - name: Cache GDAL Homebrew tree
      id: gdal-cache
      if: runner.os == 'macOS'
      # Restore-only: the matching save step below is pinned to `main`, because
      # the repository is on GitHub's 10 GB cache ceiling and a cache written on
      # any other ref is unreadable from `main` and from PRs. See "Cache policy"
      # in ci.yml.
      uses: actions/cache/restore@v5
      with:
        path: ~/gdal-brew-tree.tar
        # ImageVersion keeps the cached Cellar in lockstep with the Homebrew
        # formula versions baked into the runner image, so `brew install`
        # below relinks instead of re-pouring.
        key: macos-gdal-tree-${{ runner.arch }}-${{ steps.image.outputs.version }}-${{ hashFiles('scripts/install-gdal.sh', 'scripts/pack-gdal-tree.sh') }}

    # Cache hit: unpack GDAL's Cellar + opt entries, then relink. This skips
    # pouring ~70 bottles (~6 min). `brew install` below does NOT relink an
    # already-installed-but-unlinked formula, so the symlinks (`gdal-config`
    # etc.) must be recreated explicitly here.
    - name: Restore GDAL Homebrew tree
      if: runner.os == 'macOS' && steps.gdal-cache.outputs.cache-hit == 'true'
      shell: bash
      run: |
        tar -xf ~/gdal-brew-tree.tar -C /
        # Link GDAL and its non-keg-only dependencies; keg-only ones (llvm …)
        # fail to link by design and are reached via their restored `opt` links.
        for f in gdal $(brew deps gdal); do
          brew link --overwrite "$f" 2>/dev/null || true
        done
        command -v gdal-config >/dev/null || { echo "gdal-config missing after relink"; exit 1; }

    # `--testing` is deliberately not passed. The runners are Ubuntu, where the
    # Debian testing repo cannot satisfy `libgdal-dev=3.12.*` anyway — the
    # install failed and fell back to Ubuntu's own 3.8.4, so the only effect was
    # re-indexing a foreign repo on every run.
    - name: Install GDAL
      shell: bash
      env:
        HOMEBREW_NO_AUTO_UPDATE: "1"
      run: ./scripts/install-gdal.sh

    # Cache miss: pack the tree for next run.
    - name: Pack GDAL Homebrew tree
      if: runner.os == 'macOS' && steps.gdal-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
      shell: bash
      run: ./scripts/pack-gdal-tree.sh ~/gdal-brew-tree.tar

    - name: Save GDAL Homebrew tree
      if: runner.os == 'macOS' && steps.gdal-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
      uses: actions/cache/save@v5
      with:
        path: ~/gdal-brew-tree.tar
        key: ${{ steps.gdal-cache.outputs.cache-primary-key }}

    - name: Check GDAL installation
      id: verify
      shell: bash
      run: |
        version="$(gdal-config --version)"
        echo "GDAL version: $version"
        echo "version=$version" >> "$GITHUB_OUTPUT"
