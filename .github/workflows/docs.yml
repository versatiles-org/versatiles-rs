name: Documentation

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v2.3.2
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    name: Build and Deploy Documentation
    runs-on: ubuntu-latest
    # Only run for regular release versions (not pre-releases like v3.0.1-rc.3)
    if: (github.ref_type == 'tag' && !contains(github.ref_name, '-')) || github.event_name == 'workflow_dispatch'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: versatiles_node/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "docs"
          cache-targets: true
          cache-bin: false

      - name: Install dependencies
        working-directory: ./versatiles_node
        run: npm i

      - name: Build package
        working-directory: ./versatiles_node
        run: npm run build:debug

      - name: Generate docs
        working-directory: ./versatiles_node
        run: npm run docs:generate

      - name: Disable Jekyll
        working-directory: ./versatiles_node
        run: touch docs/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload docs
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./versatiles_node/docs

      - name: Deploy docs
        id: deployment
        uses: actions/deploy-pages@v5
