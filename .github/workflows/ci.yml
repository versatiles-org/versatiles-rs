name: CI

on:
  push:
    # Only the branches whose CI result is a status of record: `main` gates
    # merges via the required "CI Success" check, and `dev` needs its own
    # passing run before it can be fast-forwarded onto `main`. Feature
    # branches are covered by the `pull_request` trigger below — listing
    # them here too would run the whole matrix twice per push.
    branches:
      - main
      - dev
    tags-ignore:
      - "**" # Don't run twice on commits with tags
    paths-ignore:
      - "docker/**"
      - "**.Dockerfile"
      - "**.md"
  pull_request:
  schedule:
    - cron: "15 6 * * 2"
  workflow_dispatch:

# One in-flight run per PR (or per branch, for pushes). Pushing again
# supersedes the previous run instead of leaving both to race through the
# full ~17-job matrix. `main` is exempt: its runs produce the "CI Success"
# status that branch protection requires, so they must always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Cache policy: only `main` writes.
#
# GitHub scopes every cache entry to the ref that created it, and a run may
# only read its own ref's scope plus the *default branch*'s scope. `main` is
# the default branch here and every PR targets it, so an entry written on `dev`
# is invisible to PRs and to `main` — it only ever serves the next `dev` push.
#
# That matters because the repository sits exactly on GitHub's 10 GB cache
# ceiling: a single copy of the eight Rust entries plus the macOS GDAL tree is
# already ~10.1 GB. There is no room for a second branch's copy, so whichever
# branch writes last evicts the other by LRU. With `dev` pushed several times a
# day and `main` only on fast-forward, `dev` won every eviction and `main`/PR
# runs compiled the workspace from nothing on every single run.
#
# So the writes are pinned to `main`: one copy, readable by `main`, by `dev`
# (default-branch scope), and by every PR. The cost is that a `dev` push is
# warm from the last fast-forward rather than from its own previous push —
# bounded by how often `dev` lands on `main`, which is a few times a week.
#
# If `dev` ever becomes the repository's default branch, flip these refs with
# it; the rule is "the default branch writes", not "main writes".

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Full debuginfo is the single biggest cost in a test build: measured over the
  # whole workspace, `cargo test --no-run` takes 94s and leaves a 3.6 GB target
  # dir with it, 83s and 2.7 GB with line tables only. Line tables are what
  # backtraces actually need — dropping to `0` saves a further 6s but strips the
  # file:line from every backtrace frame, which is a bad trade when a CI-only
  # failure is the thing you're debugging. Cargo.toml keeps full debuginfo for
  # local development; `dev` covers dependencies, `test` the test targets — a
  # `cargo test` build uses both.
  # (`CARGO_INCREMENTAL` is not set here: dtolnay/rust-toolchain already exports
  # `CARGO_INCREMENTAL=0` on every job.)
  CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
  CARGO_PROFILE_TEST_DEBUG: "line-tables-only"

jobs:
  # ============================================================================
  # Markdown Lint
  # ============================================================================
  markdown-lint:
    name: "Markdown Lint"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check Markdown
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: |
            **/*.md
            #node_modules
            #versatiles_node/node_modules
            #target

  # ============================================================================
  # Linux: Format
  # ============================================================================
  linux-format:
    name: "Linux: Format"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check format
        run: cargo fmt-check

  # ============================================================================
  # Linux: Dependencies
  # ============================================================================
  # The only check that looks at *published* vulnerabilities: clippy and CodeQL
  # analyse the code in this repository, cargo-deny reads Cargo.lock against the
  # RustSec advisory database. It also enforces the licence allow-list and the
  # crates.io-only source rule. The policy, and the reasoning behind every
  # accepted exception, lives in deny.toml.
  #
  # Unlike every other job here, this one can turn red without anything in the
  # repository changing — a new advisory published against a dependency that was
  # already there. That is what the weekly `schedule` trigger at the top of this
  # file is for, and why a green run is not durable the way a green test run is.
  #
  # No toolchain and no compilation: the action ships a prebuilt cargo-deny, and
  # the checks read the manifests and the lockfile.
  linux-deny:
    name: "Linux: Dependencies"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check dependencies
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # ============================================================================
  # Linux: MSRV
  # ============================================================================
  # `rust-version` in the root Cargo.toml is a promise to anyone depending on
  # these crates from crates.io, and nothing else here keeps it honest: every
  # other job runs `stable`, which is always new enough. This one pins the
  # declared minimum, so raising it becomes a deliberate edit rather than
  # something that happens the first time a newer language feature is used —
  # or, as happened before this job existed, the first time a dependency starts
  # needing one.
  #
  # Libraries and binaries only. `--all-targets` would drag in dev-dependencies
  # (`serial_test` alone declares 1.93.1), and those are not part of what a
  # consumer compiles. Default features for the same reason: `gdal` is optional
  # and needs the container image to build at all.
  #
  # Deliberately uncached — see "Cache policy" above. The repository sits on
  # GitHub's 10 GB cache ceiling, so a second toolchain's target directory would
  # not add space, it would evict someone else's entry.
  linux-msrv:
    name: "Linux: MSRV"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The toolchain is read from `rust-version` in the root Cargo.toml, so
      # raising the MSRV is a single edit and cannot drift from what the crates
      # promise on crates.io.
      #
      # `RUSTUP_TOOLCHAIN` is what actually pins the check. rust-toolchain.toml
      # in the repository root selects `stable`, and a toolchain file outranks
      # `rustup default`, so installing the MSRV and defaulting to it is not
      # enough: `cargo check` below would still run on stable and pass no matter
      # what `rust-version` says.
      - name: Setup Rust
        run: |
          msrv="$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)"
          [ -n "$msrv" ] || { echo "::error::no rust-version found in Cargo.toml"; exit 1; }
          echo "MSRV from Cargo.toml: $msrv"
          rustup toolchain install "$msrv" --profile minimal --no-self-update
          echo "RUSTUP_TOOLCHAIN=$msrv" >> "$GITHUB_ENV"

      - name: Check workspace
        run: cargo check --workspace --lib --bins

  # ============================================================================
  # Linux: Docs
  # ============================================================================
  linux-docs:
    name: "Linux: Docs"
    runs-on: ubuntu-latest
    # GDAL comes from the image rather than apt; see "Install build tools".
    container: ghcr.io/osgeo/gdal:ubuntu-small-3.12.0
    steps:
      # The GDAL image is minimal, so the build toolchain the runner would
      # normally provide has to be installed. This runs before checkout so that
      # actions/checkout has git. Installing 129 packages here takes ~15s,
      # against ~75s for the 279 that `apt-get install libgdal-dev` pulls in —
      # and this way GDAL is the 3.12 the project actually wants, which Ubuntu's
      # own packages cannot supply.
      - name: Install build tools
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            build-essential git pkg-config libclang-dev

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        
      # `gdal` is opt-in (`default = []`), so without it rustdoc never sees the
      # gdal-gated modules — `from_gdal`, `mosaic_tools::tile` — and `-D warnings`
      # never checks their docs. That's why this job installs GDAL.
      #
      # `--document-private-items` extends the same check to items that are not
      # publicly reachable — most of the code. Without it rustdoc resolves links
      # only in public items, so a broken link in anything `pub(crate)`,
      # `pub(super)` or private goes unnoticed.
      #
      # Keep these flags in step with `scripts/check-rust.sh`, or a link can
      # fail locally and pass here (or the reverse).
      - name: Build docs
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --document-private-items --features gdal,versatiles_container/test

  # ============================================================================
  # Linux: Node.js
  # ============================================================================
  linux-nodejs:
    name: "Linux: Node.js"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # No cache: at 201s saved per 0.88 GB this returned the least of any cache
      # here, and the budget is at GitHub's 10 GB ceiling, so its space buys the
      # musl job's — which returns roughly five times as much. Expect this job
      # around 594s rather than 393s, still short of the critical path.

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      # `cache: "npm"` is not used, because it saves from whatever ref it runs
      # on and there is no way to tell it not to. Two of the three npm entries
      # in the store were written from `dev`, where nothing can read them — see
      # "Cache policy" above. Restoring is unconditional; only `main` writes.
      - name: Locate the npm cache
        id: npm-dir
        shell: bash
        run: echo "path=$(npm config get cache)" >>"$GITHUB_OUTPUT"

      - name: Restore npm cache
        id: npm-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.npm-dir.outputs.path }}
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('versatiles_node/package-lock.json') }}
          # A lockfile bump should still start from the previous download rather
          # than from nothing: npm's store is content-addressed, so what did not
          # change is still valid.
          restore-keys: npm-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        working-directory: ./versatiles_node
        run: npm install

      - name: Save npm cache
        if: github.ref == 'refs/heads/main' && steps.npm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.npm-dir.outputs.path }}
          key: ${{ steps.npm-cache.outputs.cache-primary-key }}

      - name: Build package
        working-directory: ./versatiles_node
        run: npm run build

      - name: Check types
        working-directory: ./versatiles_node
        run: npm run typecheck

      - name: Check lints
        working-directory: ./versatiles_node
        run: npm run lint

      - name: Check format
        working-directory: ./versatiles_node
        run: npm run format:check

      - name: Run tests
        working-directory: ./versatiles_node
        run: npm run test

      - name: Run example tests
        working-directory: ./versatiles_node
        run: npm run test:examples

  # ============================================================================
  # Linux: Coverage
  # ============================================================================
  linux-coverage:
    name: "Linux: Coverage"
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push'
    # GDAL comes from the image rather than apt; see "Install build tools".
    container: ghcr.io/osgeo/gdal:ubuntu-small-3.12.0
    steps:
      # The GDAL image is minimal, so the build toolchain the runner would
      # normally provide has to be installed. This runs before checkout so that
      # actions/checkout has git. Installing 129 packages here takes ~15s,
      # against ~75s for the 279 that `apt-get install libgdal-dev` pulls in —
      # and this way GDAL is the 3.12 the project actually wants, which Ubuntu's
      # own packages cannot supply.
      - name: Install build tools
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            build-essential git pkg-config libclang-dev

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "linux-coverage"
          cache-targets: true
          cache-on-failure: false
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }} # see "Cache policy" above

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate coverage
        # Skip e2e tests (test functions prefixed with e2e_) during coverage
        run: cargo llvm-cov test --workspace --all-features --tests --lcov --output-path ./lcov.info -- --skip e2e_

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          files: ./lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true

  # ============================================================================
  # Linux: Feature Checks
  # ============================================================================
  # The feature combinations that are only compiled, never run. One job rather
  # than three: they differ by a single feature flag, so most of what they build
  # is identical, and sharing a target directory means the second and third
  # checks reuse the first one's artifacts instead of each starting from
  # nothing. It also means one cache entry rather than three, which matters —
  # the repository is at GitHub's 10 GB cache ceiling.
  #
  # Kept as separate steps so the timings stay legible per feature set.
  linux-feature-checks:
    name: "Linux: Features (checks)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # Shares the runner-side cache with the matrix's `default` entry, which
      # writes it: both compile the workspace on the runner itself, so whatever
      # is not feature-gated is common to them. One entry rather than two —
      # the repository sits exactly on GitHub's 10 GB cache ceiling, where an
      # extra entry does not add space, it evicts someone else's.
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "linux-feature-runner"
          cache-targets: true
          cache-on-failure: false
          cache-bin: false
          save-if: false

      - name: Check no default features
        run: cargo check --workspace --all-targets --no-default-features

      - name: Check cli only
        run: cargo check --workspace --all-targets --no-default-features --features cli

      - name: Check server only
        run: cargo check --workspace --all-targets --no-default-features --features server

  # ============================================================================
  # Linux: Feature Matrix
  # ============================================================================
  linux-feature-matrix:
    name: "Linux: Features (${{ matrix.name }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "default"
            features: ""
            run-tests: true
          - name: "gdal"
            features: "--features gdal"
            container: "ghcr.io/osgeo/gdal:ubuntu-small-3.12.0"
            run-tests: true
          - name: "all-features"
            features: "--all-features"
            container: "ghcr.io/osgeo/gdal:ubuntu-small-3.12.0"
            run-clippy: true
            run-tests: true
    # Only the two GDAL entries need the image; the rest run directly on the
    # runner, where the toolchain is already present. An empty value here means
    # "no container".
    container: ${{ matrix.container }}
    steps:
      # See the same step in "Linux: Docs" for why this is here and why it runs
      # before checkout. Only needed inside the container.
      - name: Install build tools
        if: matrix.container
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            build-essential git pkg-config libclang-dev

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Keyed by environment, not just by job. The GDAL entries run inside a
      # container and `default` runs on the runner itself, so their CARGO_HOME
      # differs — and rust-cache hashes that into the key. Under one shared key
      # the runner-side entry spent every run looking for a key only the
      # container ever wrote, and rebuilt the workspace from nothing: 444s,
      # against 252s for all-features, which compiles strictly more.
      #
      # The container entries keep the old key so their working cache survives
      # this change.
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.container && 'linux-feature' || 'linux-feature-runner' }}
          cache-targets: true
          cache-on-failure: false
          cache-bin: false
          # Only the two entries that write, and only from `main` —
          # see "Cache policy" above.
          save-if: ${{ github.ref == 'refs/heads/main' && (matrix.name == 'all-features' || matrix.name == 'default') }}

      - name: Check lints
        if: matrix.run-clippy
        run: cargo clippy --workspace --all-targets ${{ matrix.features }} -- -D warnings

      # Split from "Run tests" so the step timings separate compile cost from
      # test execution; the second command reuses these artifacts.
      - name: Build tests
        if: matrix.run-tests
        run: cargo test --workspace ${{ matrix.features }} --no-run

      - name: Run tests
        if: matrix.run-tests
        run: cargo test --workspace ${{ matrix.features }}

  # ============================================================================
  # Linux musl: Test
  # ============================================================================
  # musl and glibc differ in the places tests actually catch — thread stack
  # sizes, DNS resolution, filesystem behaviour — and the release ships musl
  # binaries for four of its eight targets. Nothing tested them until now: the
  # release Dockerfile has always been invoked with `RUN_TESTS=false`, and CI
  # had no musl job at all.
  #
  # `rust:alpine`'s host target *is* x86_64-unknown-linux-musl, so this is the
  # suite running natively against musl rather than cross-compiled. The packages
  # match the musl builder in docker/build-linux.Dockerfile, which is the image
  # the release actually uses.
  linux-musl-test:
    name: "Linux musl: Test"
    runs-on: ubuntu-latest
    container: rust:alpine
    # 1132s of compiling against 109s of tests — a ten-to-one ratio, steeper even
    # than the Windows job's four-to-one, which is what makes trading optimisation
    # for compile time pay here. Measured over the whole workspace the trade is
    # -72% on the build and +20% on the test run.
    #
    # This replaces a cache rather than complementing one. The cache could never
    # hit: the store sits over GitHub's 10 GB ceiling, so entries are evicted by
    # least-recent *access*, and an entry that is written at the end of every run
    # and never read has its creation as its access time. It was saved and
    # evicted, every run, forever. Not caching this job also returns ~1 GB of
    # pressure to a budget that has none to spare.
    env:
      CARGO_PROFILE_DEV_OPT_LEVEL: "0"
      CARGO_PROFILE_TEST_OPT_LEVEL: "0"
    if: github.ref == 'refs/heads/main'
    steps:
      # Before checkout so actions/checkout has git. No OpenSSL packages:
      # `russh` replaced `ssh2`, so openssl-sys is not in the graph.
      - name: Install build tools
        run: apk add --no-cache bash git musl-dev pkgconf

      - name: Checkout
        uses: actions/checkout@v7

      - name: Build tests
        run: cargo test --workspace --no-run

      - name: Run tests
        run: cargo test --workspace

  # ============================================================================
  # Linux ARM: Test
  # ============================================================================
  # The other untested target the release ships. A native arm64 runner, so this
  # is the real architecture rather than emulation. Uncached for the same reason
  # as the musl job above.
  linux-arm-test:
    name: "Linux ARM: Test"
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build tests
        run: cargo test --workspace --no-run

      - name: Run tests
        run: cargo test --workspace

  # ============================================================================
  # Windows: Test
  # ============================================================================
  windows-test:
    name: "Windows: Test"
    runs-on: windows-latest
    env:
      CARGO_PROFILE_DEV_OPT_LEVEL: "0"
      CARGO_PROFILE_TEST_OPT_LEVEL: "0"
    steps:
      - name: Configure Git
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
          # Cargo's libgit2 needs core.longpaths to clone the gdal git dep,
          # whose `gdal-src/source` submodule contains files whose absolute
          # path exceeds Windows' MAX_PATH (260). Remove when the gdal crate
          # is back on crates.io (see versatiles_pipeline/Cargo.toml).
          git config --global core.longpaths true

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "windows-test"
          cache-targets: true
          cache-on-failure: false
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }} # see "Cache policy" above

      # Split so the step timings separate compile cost from test execution;
      # "Test" reuses the artifacts built here.
      - name: Build tests
        run: cargo test --workspace --no-run

      - name: Run tests
        run: cargo test --workspace

      - name: Check compilation (no-default-features)
        run: cargo check --workspace --no-default-features

  # ============================================================================
  # Windows: Node.js
  # ============================================================================
  windows-nodejs:
    name: "Windows: Node.js"
    runs-on: windows-latest
    steps:
      - name: Configure Git
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
          # Cargo's libgit2 needs core.longpaths to clone the gdal git dep,
          # whose `gdal-src/source` submodule contains files whose absolute
          # path exceeds Windows' MAX_PATH (260). Remove when the gdal crate
          # is back on crates.io (see versatiles_pipeline/Cargo.toml).
          git config --global core.longpaths true

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "windows-nodejs"
          cache-targets: true
          cache-on-failure: false
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }} # see "Cache policy" above

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      # `cache: "npm"` is not used, because it saves from whatever ref it runs
      # on and there is no way to tell it not to. Two of the three npm entries
      # in the store were written from `dev`, where nothing can read them — see
      # "Cache policy" above. Restoring is unconditional; only `main` writes.
      - name: Locate the npm cache
        id: npm-dir
        shell: bash
        run: echo "path=$(npm config get cache)" >>"$GITHUB_OUTPUT"

      - name: Restore npm cache
        id: npm-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.npm-dir.outputs.path }}
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('versatiles_node/package-lock.json') }}
          # A lockfile bump should still start from the previous download rather
          # than from nothing: npm's store is content-addressed, so what did not
          # change is still valid.
          restore-keys: npm-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        working-directory: ./versatiles_node
        run: npm install

      - name: Save npm cache
        if: github.ref == 'refs/heads/main' && steps.npm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.npm-dir.outputs.path }}
          key: ${{ steps.npm-cache.outputs.cache-primary-key }}

      - name: Build package
        working-directory: ./versatiles_node
        run: npm run build:debug

      - name: Check types
        working-directory: ./versatiles_node
        run: npm run typecheck

      - name: Check lints
        working-directory: ./versatiles_node
        run: npm run lint

      - name: Check format
        working-directory: ./versatiles_node
        run: npm run format:check

      - name: Run tests
        working-directory: ./versatiles_node
        run: npm run test

      - name: Run example tests
        working-directory: ./versatiles_node
        run: npm run test:examples

  # ============================================================================
  # Windows ARM: Test
  # ============================================================================
  # Uncached and `main`-only, for the two separate reasons the musl job is:
  #
  # The cache went first. One entry is ~1 GB, and the store sits over GitHub's
  # 10 GB ceiling whenever a `Cargo.lock` bump leaves a key holding two versions
  # — so this entry was competing for space against jobs that run on every push,
  # and losing it costs ~210s here against ~1 GB returned to a budget with none
  # to spare.
  #
  # The `main` gate is a compute decision rather than a cache one: an uncached
  # job neither reads nor writes the store, so skipping it on `dev` saves
  # runner minutes, not bytes.
  #
  # What that gives up: `Windows: Test` still covers Windows on every push, but
  # only on x64. An arm64-specific failure — a target-gated intrinsic, an
  # alignment assumption — now surfaces after the merge instead of before it.
  # It still surfaces before a release, since every tag is cut from `main`.
  windows-arm-test:
    name: "Windows ARM: Test"
    runs-on: windows-11-arm
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Configure Git
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
          # Cargo's libgit2 needs core.longpaths to clone the gdal git dep,
          # whose `gdal-src/source` submodule contains files whose absolute
          # path exceeds Windows' MAX_PATH (260). Remove when the gdal crate
          # is back on crates.io (see versatiles_pipeline/Cargo.toml).
          git config --global core.longpaths true

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # Split so the step timings separate compile cost from test execution;
      # "Test" reuses the artifacts built here.
      - name: Build tests
        run: cargo test --workspace --no-run

      - name: Run tests
        run: cargo test --workspace

  # ============================================================================
  # macOS: GDAL
  # ============================================================================
  macos-gdal:
    name: "macOS: GDAL"
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup GDAL
        id: gdal
        uses: ./.github/actions/setup-gdal

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          # Bake GDAL version into the key so brew rolling forward (e.g. 3.12.4 →
          # 3.13.0) doesn't leave us with rlibs that hard-code a Cellar path that
          # no longer exists.
          shared-key: "macos-gdal-${{ steps.gdal.outputs.version }}"
          cache-targets: true
          cache-on-failure: false
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }} # see "Cache policy" above

      # Split so the step timings separate compile cost from test execution;
      # "Test with GDAL" reuses the artifacts built here.
      - name: Build tests
        run: cargo test --workspace --features gdal --no-run

      - name: Run tests
        run: cargo test --workspace --features gdal

  # ============================================================================
  # CI Success - Summary job
  # ============================================================================
  ci-success:
    name: "CI Success"
    runs-on: ubuntu-latest
    needs:
      - linux-coverage
      - linux-deny
      - linux-docs
      - linux-feature-checks
      - linux-feature-matrix
      - linux-arm-test
      - linux-format
      - linux-msrv
      - linux-musl-test
      - linux-nodejs
      - macos-gdal
      - markdown-lint
      - windows-arm-test
      - windows-nodejs
      - windows-test
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" || "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "::error::Some jobs failed or were cancelled"
            exit 1
          fi
          echo "All CI jobs passed successfully!"