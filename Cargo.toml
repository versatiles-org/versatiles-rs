[workspace]
members = [
	"versatiles",
	"versatiles_container",
	"versatiles_core",
	"versatiles_derive",
	"versatiles_geometry",
	"versatiles_image",
	"versatiles_node",
	"versatiles_pipeline",
]
resolver = "3"

[workspace.package]
authors = ["Michael Kreil <versatiles@michael-kreil.de>"]
categories = [
	"command-line-utilities",
	"science::geo",
	"web-programming::http-server",
]
description = "A toolbox for converting, checking and serving map tiles in various formats."
edition = "2024"
homepage = "https://versatiles.org"
keywords = ["versatiles", "mbtiles", "pmtiles", "tiles", "map"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/versatiles-org/versatiles-rs"
# The oldest toolchain the workspace compiles on, enforced by the "Linux: MSRV"
# CI job and repeated in README.md. 1.94 is not a free choice: `h3o` (a default
# dependency of versatiles_pipeline) calls `f64::mul_add` inside a `const fn`,
# which is not stable before it, and declares no `rust-version` of its own — so
# without this line a 1.93 user gets a compile error inside a dependency rather
# than cargo's "requires rustc 1.94" message.
rust-version = "1.94"
version = "4.13.0"
exclude = [
	".githooks/",
	".github/",
	".gitignore",
	".prettierignore",
	".vscode/",
	"/docker",
	"/scripts",
	"/testdata",
]

[workspace.lints.rust]
missing_docs = "deny"
unused_imports = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[workspace.lints.clippy]
# Enable pedantic lints for code quality
pedantic = { level = "deny", priority = -1 }

# Every lint suppression must say why it is there. A bare `#[allow]` is a claim
# that a lint should not fire, and the claim silently stops being true — an
# earlier audit found 43 suppressions guarding code that no longer triggered
# anything, 25 of them hiding real `dead_code` from the compiler.
#
# Prefer `#[expect(..., reason = "...")]`, which additionally warns once the
# lint stops firing. Three situations cannot use it and keep `#[allow]` with a
# reason and a note in place: attributes inside a `macro_rules!` body (the lint
# fires at each expansion, so the expectation reads as unfulfilled), `dead_code`
# on items used only by tests (unfulfilled under `--all-targets`, required for
# the library build), and functions re-emitted by an attribute macro such as
# `#[napi]`.
#
# `allow_attributes` — which would forbid `#[allow]` outright — is deliberately
# not enabled, because those three cases have no `#[expect]` spelling.
allow_attributes_without_reason = "deny"

# Allow noisy/stylistic lints that don't improve safety
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
similar_names = "allow"
doc_markdown = "allow"

# Warn when return values should have #[must_use]
must_use_candidate = "deny"

# Allow reasonable casting patterns in container code
cast_precision_loss = "allow"

# Allow stylistic patterns used consistently in codebase
duration_suboptimal_units = "allow"
ignored_unit_patterns = "allow"
items_after_statements = "allow"
iter_without_into_iter = "allow"
match_wildcard_for_single_variants = "allow"
missing_fields_in_debug = "allow"
return_self_not_must_use = "allow"
trivially_copy_pass_by_ref = "allow"
unnecessary_debug_formatting = "allow"
unnecessary_literal_bound = "allow"
unnecessary_wraps = "allow"
unreadable_literal = "allow" # Domain-specific values (coordinates, binary test data) are clearer without separators
used_underscore_binding = "allow"

[workspace.metadata.release]
allow-branch = ["main"]
consolidate-commits = true
dependent-version = "upgrade"
pre-release-commit-message = "release: v{{version}}"
shared-version = true
sign-commit = true
sign-tag = true
tag-name = "v{{version}}"

[profile.dev]
opt-level = 1
debug = true
rpath = false
lto = false
debug-assertions = true
panic = "unwind"
incremental = true
overflow-checks = true

[profile.test]
opt-level = 1
lto = false
incremental = true

[profile.release]
opt-level = 3
debug = false
rpath = false
lto = true
debug-assertions = false
codegen-units = 1
panic = "unwind"
incremental = false
overflow-checks = false
strip = true

[workspace.dependencies]
# Core dependencies
anyhow = { version = "1.0.104", default-features = false, features = ["std"] }
async-trait = { version = "0.1.92", default-features = false }
byteorder = { version = "1.5.0", default-features = false, features = ["std"] }
enumset = { version = "1.1.14", default-features = false }
futures = { version = "0.3.34", features = ["default"] }
itertools = { version = "0.15.0", default-features = false }
log = { version = "0.4.34", default-features = false }
num_cpus = { version = "1.17.0", default-features = false }
regex = { version = "1.13.1", default-features = false, features = [
	"std",
	"unicode-case",
	"unicode-perl",
] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "sync"] }

# CLI dependencies
clap = { version = "4.6.6", features = ["default", "derive", "wrap_help"] }
# No `humantime`: both loggers install a custom `format` that never prints a
# timestamp, so the feature only pulled in `jiff` (~5 s of every clean build).
env_logger = { version = "0.11.11", default-features = false, features = [
	"auto-color",
	"regex",
] }

# Container/archive dependencies
# `astral-tokio-tar` rather than `tar`: the tar reader and writer sit on top of
# async sources and sinks, and the sync `tar::Builder`/`tar::Archive` forced a
# blocking bridge at every one of those boundaries. `default-features = false`
# drops `xattr`, which this project never reads and which is unix-only.
astral-tokio-tar = { version = "0.7.0", default-features = false }

# HTTP/Server dependencies
axum = { version = "0.8.9", default-features = false }
reqwest = { version = "0.13.4", default-features = false, features = ["default-tls"] }

# Image processing dependencies
imageproc = { version = "0.27.0", default-features = false }

# Geometry dependencies
geo = { version = "0.33.1", default-features = false }
geo-types = { version = "0.7.20" }
rstar = { version = "0.13.0", default-features = false }

# Utility dependencies
wildmatch = { version = "2.6.1", default-features = false }

# Multithreading optimization dependencies
moka = { version = "0.12", features = ["future"] }  # Lock-free LRU cache
dashmap = "6.2"                                     # Concurrent HashMap
parking_lot = "0.12"                                # Fast synchronization
arc-swap = "1.9"                                    # Lock-free updates

# Development dependencies
approx = { version = "0.5.1", default-features = false, features = ["std"] }
assert_fs = "1.1.4"
pretty_assertions = "1.4.1"
rstest = { version = "0.26.1", default-features = false }
tempfile = "3.27.0"

versatiles = { version = "4.13.0", path = "versatiles", default-features = false }
versatiles_container = { version = "4.13.0", path = "versatiles_container", default-features = false }
versatiles_core = { version = "4.13.0", path = "versatiles_core", default-features = false }
versatiles_derive = { version = "4.13.0", path = "versatiles_derive", default-features = false }
versatiles_geometry = { version = "4.13.0", path = "versatiles_geometry", default-features = false }
versatiles_image = { version = "4.13.0", path = "versatiles_image", default-features = false }
versatiles_pipeline = { version = "4.13.0", path = "versatiles_pipeline", default-features = false }
