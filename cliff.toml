# git-cliff config for the grouped release notes built by
# scripts/workflow-create-release.sh. This relies on git-cliff's defaults and only
# overrides what the defaults get wrong for *release notes*:
#   - a minimal body: no per-version "## [x.y.z]" header, plain group headings,
#     `scope`-prefixed subject line only. The scope is what makes a one-line
#     summary legible — "Open containers read-only" says nothing without the
#     `mbtiles` in front of it;
#   - commit groups that SKIP noise (style/test/chore/ci/build/release/bench +
#     merges), which the default would otherwise render as their own sections.
#
# A commit marked breaking — `feat!: ...` or a `BREAKING CHANGE:` footer — is
# listed in a "Breaking Changes" section at the top *and* flagged in its own
# group, so the summary is prominent without the group listing being incomplete.
#
# Nothing detects a break on its own, so a commit that makes one has to say so.
# No commit in this repository ever has, which is why that section has never
# rendered: v4.9.0 dropped TileProcessor and ReadTileSource from published
# crates and the generated notes filed both under "Refactoring".
#
# Internal-only work should NOT appear in release notes. It is dropped either by
# its type (`ci: ...`) or by its scope on any type (`feat(ci): ...`). Parsers are
# first-match-wins, so the scope rules must come before the type rules below —
# without them `fix(ci): ...` matches `^fix` and lands in "Bug Fixes", which is
# how CI plumbing ended up in the v4.9.0 notes.
# Docs: https://git-cliff.org/docs/configuration

[changelog]
header = ""
body = """
{% set breaking = commits | filter(attribute="breaking", value=true) -%}
{%- if breaking | length > 0 %}
### \u26a0 Breaking Changes

{% for commit in breaking -%}
- {% if commit.scope %}`{{ commit.scope }}`: {% endif %}{{ commit.message | split(pat="\n") | first | upper_first }}
{% endfor %}
{%- endif -%}
{%- for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}

{% for commit in commits -%}
- {% if commit.breaking %}**Breaking:** {% endif %}{% if commit.scope %}`{{ commit.scope }}`: {% endif %}{{ commit.message | split(pat="\n") | first | upper_first }}
{% endfor -%}
{% endfor -%}
"""
footer = ""
trim = true

[git]
# Keep non-conventional commits (e.g. a plain "Update dependencies") under
# "Other Changes" rather than dropping them (git-cliff drops them by default).
filter_unconventional = false

# A trailer glued to the subject with no blank line between makes the whole
# message unparseable as a conventional commit, and git-cliff then falls back to
# the raw subject — leaking the `type(scope):` prefix into the notes. Repair the
# separation before parsing rather than rendering the prefix.
#
# The second entry marks a break that went out unmarked. Pushed history is not
# rewritten, so the `!` is added here instead; match the whole subject so no
# other commit is caught by it.
commit_preprocessors = [
  { pattern = "^(\\w+(\\(.+?\\))?!?: [^\\n]+)\\n([^\\n])", replace = "${1}\n\n${3}" },
  # 91256f0f made open-ended CORS patterns a startup error (#254).
  { pattern = "^fix\\(cors\\): update allowed origins patterns to enforce scheme and prevent open-ended globs", replace = "fix(cors)!: update allowed origins patterns to enforce scheme and prevent open-ended globs" },
]

commit_parsers = [
  # Scope-based skips, before any type rule can claim them.
  { message = "^\\w+\\((bench|ci|build|chore|style|test|release)\\)", skip = true },
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactoring" },
  { message = "^docs?", group = "<!-- 4 -->Documentation" },
  { message = "^(style|test|chore|ci|build|release|bench)", skip = true },
  { message = "^Merge ", skip = true },
  { message = ".*", group = "<!-- 5 -->Other Changes" },
]
