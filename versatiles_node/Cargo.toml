[package]
name = "versatiles_node"
authors.workspace = true
description = "Node.js bindings for VersaTiles"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow.workspace = true
ctor = "1.0.13"
env_logger.workspace = true
log.workspace = true
napi = { version = "3.12.2", features = ["async"] }
napi-derive = "3.6.3"
tokio.workspace = true
versatiles = { workspace = true, default-features = false, features = [
	"codegen",
	"server",
] }
# `sftp` brings in the SFTP reader and writer: without it an `sftp://` URL is
# an unsupported scheme here, however good the key handling above it is.
versatiles_container = { workspace = true, features = ["sftp"] }
versatiles_core = { workspace = true, default-features = false }
versatiles_geometry.workspace = true
serde.workspace = true
serde_json = { version = "1.0", default-features = false, features = ["std"] }

[dev-dependencies]
approx.workspace = true
geo-types.workspace = true
rstest.workspace = true
pretty_assertions.workspace = true
tempfile.workspace = true

[build-dependencies]
napi-build = "2"
