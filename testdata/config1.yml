# VersaTiles server configuration example

server:
  ip: 127.0.0.1
  port: 51234
  minimal_recompression: true
  disable_api: true
  # `Cache-Control` of tiles, `tiles.json` and static files. Not sent with a 404
  # or an error, which is why it is set here and not under the extra headers.
  cache_control: "public, max-age=86400, immutable"

# --- CORS & Headers ----------------------------------------------------------
# CORS applies to API and tile/static responses.
cors:
  # List of allowed origins. Supports `https://*.host` and `https://host:*`.
  allowed_origins:
    - "https://example.org"
    - "https://*.other-example.org"

  # Preflight cache duration in seconds (Access-Control-Max-Age).
  max_age_seconds: 86400

# Extra response headers. Keys are case-insensitive.
# These are added to every HTTP response, a 404 and an error included. If a
# header already exists, this overrides it. So no cache headers here: an error
# would be cached like a tile.
extra_response_headers:
  # Useful for resource timing across origins; align with your CORS policy.
  Timing-Allow-Origin: "*"
  # Keep the tile URLs out of search engines.
  X-Robots-Tag: "noindex"

# --- Static mounts -----------------------------------------------------------
static:
  - src: "static.tar.br"
    prefix: "/"
  - src: "../testdata/static.tar.gz"
    prefix: "/whynot/"
  - src: "./"
    prefix: "/assets"

# --- Tile sources ------------------------------------------------------------
tiles:
  - name: osm
    src: "https://download.versatiles.org/osm.versatiles"

  - name: berlin
    src: "./berlin.mbtiles"

  - name: pipeline
    src: "./berlin.vpl"
