[package]
name = "versatiles_pipeline"
authors.workspace = true
categories.workspace = true
description.workspace = true
edition.workspace = true
exclude.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[dependencies]
ab_glyph = { version = "0.2.32", default-features = false, features = ["std"] }
anyhow.workspace = true
async-trait.workspace = true
cel-interpreter = { version = "0.10.0", default-features = false, features = ["regex"] }
deadpool = { version = "0.13", features = ["managed"], optional = true }
futures.workspace = true
geo.workspace = true
geo-types.workspace = true
# TEMP: pinned to an upstream commit for GDAL 3.13 compatibility
# (https://github.com/georust/gdal/pull/714: GDT_Byte → GDT_UInt8,
# bOperateInBufType), which is merged but not yet released. Revert to the
# crates.io version once a release including the fix is published.
gdal = { git = "https://github.com/georust/gdal", rev = "c0a6266b987a2c2d44aea9956c2cae1ed71445cf", version = "0.19", optional = true }
gdal-sys = { git = "https://github.com/georust/gdal", rev = "c0a6266b987a2c2d44aea9956c2cae1ed71445cf", version = "0.12", optional = true, features = ["bindgen"] }
imageproc = { workspace = true, features = ["text"] }
itertools = { workspace = true, features = ["use_alloc"] }
log.workspace = true
moka.workspace = true
nom = { version = "8.0.0" }
nom-language = { version = "0.1.0" }
regex.workspace = true
rstar.workspace = true
serde.workspace = true
reqwest.workspace = true
tokio.workspace = true

versatiles_container.workspace = true
versatiles_core.workspace = true
versatiles_derive.workspace = true
versatiles_geometry.workspace = true
versatiles_image.workspace = true
h3o = { version = "0.11.1", features = ["geo"] }

[dev-dependencies]
serde_json.workspace = true
criterion.workspace = true
approx.workspace = true
assert_fs.workspace = true
axum = { workspace = true, features = ["http1", "tokio"] }
pretty_assertions.workspace = true
regex.workspace = true
rstest.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "net"] }

versatiles_container = { workspace = true, features = ["test"] }
versatiles_core = { workspace = true, features = ["test"] }
versatiles_geometry = { workspace = true, features = ["test"] }
versatiles_image = { workspace = true, features = ["test"] }

[features]
default = []
codegen = []
gdal = ["dep:gdal", "dep:gdal-sys", "dep:deadpool"]
mlt = ["versatiles_container/mlt"]
bindgen = ["gdal/bindgen"]

[[bench]]
name = "vector_filter_features"
harness = false
