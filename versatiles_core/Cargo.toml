[package]
name = "versatiles_core"
authors.workspace = true
categories.workspace = true
description.workspace = true
edition.workspace = true
exclude.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
brotli = { version = "9.0.0", default-features = false, features = ["std"] }
byteorder = { workspace = true, features = [] }
dashmap.workspace = true
clap = { workspace = true, optional = true, features = ["derive"] }
colored = { version = "3.1.1", default-features = false, optional = true }
enumset.workspace = true
flate2 = { version = "1.1.10", default-features = false, features = ["default"] }
futures.workspace = true
itertools.workspace = true
log.workspace = true
lru = "0.18"
num-traits = "0.2.19"
num_cpus.workspace = true
percent-encoding = "2"
regex.workspace = true
reqwest.workspace = true
# `default-features = false` drops russh's `aws-lc-rs` backend, which needs NASM
# and cmake on Windows; `ring` ships pre-assembled objects for the MSVC targets
# and so builds with nothing but the C compiler the runners already have. This
# is the whole reason SFTP can now be built on every target instead of unix only.
russh = { version = "0.63", default-features = false, features = [
	"flate2",
	"ring",
	"rsa",
], optional = true }
russh-sftp = { version = "3.0", optional = true }
socket2 = { version = "0.6", optional = true }
ssh2-config = { version = "0.8", default-features = false, optional = true }
tokio.workspace = true
zstd = { version = "0.14.0", default-features = false }

versatiles_derive.workspace = true

# Host keys for the in-process SFTP test server. Optional and carried by the
# `test` feature so dependent crates can run their own SFTP paths against it;
# it is also a dev-dependency, for this crate's own `cfg(test)` builds.
getrandom = { version = "0.4", optional = true }

[dev-dependencies]
approx.workspace = true
assert_fs.workspace = true
criterion = "0.8.2"
# Host keys for the in-process SFTP test server. rand_core 0.10, which russh's
# ssh-key fork uses, no longer re-exports an `OsRng`.
getrandom = "0.4"
rstest.workspace = true
# Every test that touches the process environment has to be serialised — the
# SFTP tests set VERSATILES_SFTP_* and HOME, and now run on every platform.
serial_test = "4.0.1"
tempfile.workspace = true
# `net`/`io-util` are dev-only here: the HTTP reader's tests answer a request
# from a throwaway TcpListener, which is the only way to give it a response
# whose body disagrees with its headers. The library keeps them behind `sftp`
# so the wasm32 build stays possible; a dev-dependency does not affect that.
tokio = { workspace = true, features = ["io-util", "macros", "net"] }
wildmatch.workspace = true

# Multithreading benchmark dependencies
dashmap.workspace = true
arc-swap.workspace = true
parking_lot.workspace = true
moka.workspace = true

# Features:
# - cli: Enable CLI-specific dependencies (colored output, clap)
# - sftp: Enable sftp:// sources and sinks (pure-Rust russh; no OpenSSL)
# - test: Disable terminal output for testing
# - no-terminal: Disable terminal progress output (for Node.js bindings, WASM, etc.)
[features]
default = []
cli = ["dep:colored", "dep:clap"]
# `tokio/net` and friends are enabled here rather than on the bare `tokio`
# dependency: versatiles_core is also built for wasm32, where tokio's networking
# does not compile. Tying them to `sftp` keeps that target buildable.
sftp = [
	"dep:russh",
	"dep:russh-sftp",
	"dep:socket2",
	"dep:ssh2-config",
	"tokio/io-util",
	"tokio/net",
	"tokio/time",
]
test = ["dep:getrandom"]

[[bench]]
name = "byte_iterator"
harness = false

[[bench]]
name = "multithreading_optimizations"
harness = false

[[bench]]
name = "cache_performance"
harness = false
